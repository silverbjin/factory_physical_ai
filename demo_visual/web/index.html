<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMULATION_FIRST_V1</title><style>
:root{--bg:#08111f;--p:#112039;--p2:#0d192b;--line:#28425f;--text:#eef6ff;--muted:#9fb1c8;--blue:#42a8ff;--teal:#36d0b0;--orange:#ff9f43}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#153d6655,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}header{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.muted{color:var(--muted);font-size:12px}.mode{border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--teal);font-size:12px}nav{display:flex;gap:8px;padding:14px 26px;flex-wrap:wrap}button{background:#10223a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}button.active{border-color:var(--blue)}main{max-width:1500px;margin:auto;padding:0 26px 28px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{background:linear-gradient(180deg,var(--p),var(--p2));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 40px #0005}.title{font-size:28px;font-weight:800;margin:5px 0}.result{font-size:26px;font-weight:900;color:var(--teal);margin:12px 0}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.m{background:#0a1525;border:1px solid var(--line);border-radius:10px;padding:10px}.k{font-size:10px;color:var(--muted);text-transform:uppercase}.v{font-weight:700;margin-top:3px;overflow-wrap:anywhere}.steps{display:flex;gap:7px;margin-top:16px;overflow:auto}.s{min-width:120px;flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a1525}.s.hot{border-color:var(--orange);box-shadow:0 0 20px #ff9f4333}.figure img{width:100%;border-radius:12px}.replay{margin-top:13px;border:1px dashed var(--blue);border-radius:10px;padding:10px;display:none}.replay.show{display:block}.bar{height:6px;background:#09121e;border-radius:6px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal))}.matrix{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:12px}.matrix div{font-size:11px;background:#0a1525;border:1px solid var(--line);border-radius:8px;padding:8px}@media(max-width:900px){.grid{grid-template-columns:1fr}.metrics,.matrix{grid-template-columns:1fr}}</style></head><body>
<header><div><h1>SIMULATION_FIRST_V1 — Visual Demo</h1><div class="muted">Mission • Failure Recovery • Evidence • Qualification</div></div><div class="mode" id="mode">loading</div></header>
<nav><button class="active" data-v="normal">Normal E2E</button><button data-v="nav_timeout">Navigation Timeout</button><button data-v="verify_uncertain">Verification Uncertain</button><button data-v="qualification">Final Qualification</button></nav>
<main><div class="grid"><section class="panel"><div class="muted">READ-ONLY EVIDENCE VISUALIZATION</div><div class="title" id="title"></div><div class="muted" id="source"></div><div class="result" id="result"></div><div class="metrics" id="metrics"></div><div class="steps" id="steps"></div><div class="replay" id="replay"><b id="rl"></b><div class="bar"><div class="fill" id="rf"></div></div></div><div class="matrix" id="matrix"></div></section><section class="panel figure"><img id="fig" src="/assets/03_normal_e2e.png"></section></div></main>
<script>let cur='normal';const figs={normal:'03_normal_e2e.png',nav_timeout:'04_failure_recovery.png',verify_uncertain:'02_mission_lifecycle.png',qualification:'05_evidence_qualification_pipeline.png'};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.v;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));fig.src='/assets/'+figs[cur];refresh()});function flat(o,p='',a=[]){if(o&&typeof o==='object'&&!Array.isArray(o))for(const[k,v]of Object.entries(o)){let q=p?p+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flat(v,q,a);else a.push([q,v])}return a}async function refresh(){let d=await(await fetch('/api/snapshot?view='+cur,{cache:'no-store'})).json();title.textContent=d.title||d.error;source.textContent='Source: '+(d.source||'—');mode.textContent=d.mode||'—';result.textContent=d.result||'';metrics.innerHTML=Object.entries(d.metrics||{}).map(([k,v])=>`<div class=m><div class=k>${k}</div><div class=v>${String(v)}</div></div>`).join('');steps.innerHTML=(d.steps||[]).map((x,i)=>`<div class="s ${(d.replay&&d.replay.active&&d.replay.index===i)?'hot':''}"><b>${i+1}</b><br>${typeof x==='string'?x:(x.label||x.event||'step')}</div>`).join('');matrix.innerHTML=cur==='qualification'?flat(d.matrix||{}).slice(0,24).map(([k,v])=>`<div><b>${k}</b><br>${String(v)}</div>`).join(''):'';let r=d.replay||{};replay.classList.toggle('show',!!(r.active||r.finished));rl.textContent=r.label||'';rf.style.width=(r.total?((r.index+1)/r.total*100):0)+'%'}refresh();setInterval(refresh,800)</script></body></html>
